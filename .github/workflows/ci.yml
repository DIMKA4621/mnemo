name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run model-independent platform tests
        run: python tests/test_platform.py
      - name: Run native Windows installer smoke test
        if: runner.os == 'Windows'
        run: python tests/test_install_windows.py
