name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The macOS build that actions/setup-python installs is compiled
      # WITHOUT loadable SQLite extensions: `enable_load_extension` does not
      # exist on it, so sqlite-vec never loads and not one bank can be
      # opened. `import sqlite_vec` still succeeds, which is why this only
      # showed up once a test finally opened a database. Homebrew's python
      # has them; the venv is so that pip is not refused by PEP 668.
      - name: Use Homebrew Python on macOS
        if: runner.os == 'macOS'
        run: |
          brew list python@${{ matrix.python }} >/dev/null 2>&1 \
            || brew install python@${{ matrix.python }}
          "$(brew --prefix python@${{ matrix.python }})/libexec/bin/python" \
            -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run model-independent platform tests
        run: python tests/test_platform.py
      # The pipeline itself: .md -> chunks -> vectors -> SQLite -> search,
      # on a throwaway bank with a hash provider. Seconds, and no 2.2 GB
      # model download -- relevance is measured by tests/test_search.py,
      # which needs the real one and cannot run on every push.
      - name: Run pipeline tests (hash provider, no model)
        run: python tests/test_pipeline.py
      - name: Run native Windows installer smoke test
        if: runner.os == 'Windows'
        run: python tests/test_install_windows.py
      # install.sh and uninstall.sh had never been executed by anything,
      # anywhere: the steps above install the dependencies straight into the
      # runner and test the engine's internals, so the POSIX pair shipped on
      # the strength of a reading. This runs them for real against a
      # throwaway --home -- install, --check, launcher, reinstall,
      # --deps-only, the v2 upgrade path, then uninstall down to nothing.
      - name: Run POSIX installer smoke test
        if: runner.os != 'Windows'
        run: python tests/test_install_posix.py
