[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-bootstrap"
version = "0.0.0"
description = "Self-locating launcher for the mnemo engine"
requires-python = ">=3.10"
# Engine runtime deps live in requirements.txt (single source of truth for the
# installers); declared here dynamically so the two can never drift apart.
dynamic = ["dependencies"]

[project.scripts]
mnemo = "mnemo_bootstrap:main"

# Same entry point, GUI-subsystem launcher (pythonw-backed). Used only to
# spawn background processes — Task Scheduler and shortcuts control no
# creation flags, so "no console" has to be a property of the executable.
# Never use it for a face that needs stdio (hook-inject writes the injected
# context to stdout; under pythonw there is no stdout).
[project.gui-scripts]
mnemow = "mnemo_bootstrap:main"

[tool.setuptools]
py-modules = ["mnemo_bootstrap"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
