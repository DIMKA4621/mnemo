[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-bootstrap"
version = "0.0.0"
description = "Self-locating launcher for the mnemo engine"
requires-python = ">=3.10"

[project.scripts]
mnemo = "mnemo_bootstrap:main"

[tool.setuptools]
py-modules = ["mnemo_bootstrap"]
