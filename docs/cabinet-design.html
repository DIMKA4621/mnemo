<title>Mnemo Cabinet</title>
<!--
АРХІТЕКТУРА ВКЛАДОК (прототип структури, не фінальних стилів)

  ┌──────────┬────────────────────────────────────────┐
  │ сайдбар  │  одна сторінка на всю решту вікна      │
  │ 3 пункти │  ── Памʼять:  Банки │ Файли │ Вміст    │
  │          │  ── Журнал:   картки │ деталі          │
  │ ─────────│  ── Налашт.:  вкладки вгорі + форма    │
  │ статус   │                                        │
  └──────────┴────────────────────────────────────────┘

- Сайдбар широкий за замовчуванням, кнопка згортає його в іконки.
- Крім трьох пунктів у ньому НЕМАЄ нічого: банки живуть тільки в першій
  колонці Памʼяті й ніде не дублюються.
- Горизонтального топбару немає: службові факти й тема — підвал сайдбару,
  спільний для всіх трьох сторінок.
- Кожна сторінка займає контент цілком; вони заміщають одна одну.
-->
<style>
  :root {
    --bg: #14161a;
    --bg-pane: #1b1e24;
    --bg-sunken: #101216;
    --bg-hover: #23272f;
    --line: #2c313a;
    --line-sunken: #191c22;
    --line-table: #23262c;
    --fg: #dfe3ea;
    --fg-dim: #949cab;
    --fg-mute: #8d97a8;
    --accent: #6aa8ff;
    --ok: #4bbf7a;
    --busy: #e0a94a;
    --idle: #7b8494;
    --err: #e2685f;
    --radius: 6px;
    --mono: ui-monospace, "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
    --sans: ui-sans-serif, "Segoe UI", system-ui, sans-serif;

    --btn-bg: #2a2f38;
    --btn-bg-hover: #333a45;
    --btn-border-hover: #3d444f;

    --sel-bg: #232c3a;
    --sel-fg: #cfe1ff;
    --seg-active-bg: #2f3742;

    --badge-git-fg: #9ecb8a; --badge-git-border: #35482f; --badge-git-bg: #212b1e;
    --badge-off-fg: #d0a0a0; --badge-off-border: #4a3030; --badge-off-bg: #2c2020;
    --badge-frozen-fg: #8fc6dd; --badge-frozen-border: #2f4756; --badge-frozen-bg: #1b2a33;
    --badge-ready-fg: #8ee0ac; --badge-ready-border: #2e4d3a; --badge-ready-bg: #1c2b23;
    --badge-indexing-fg: #f0c37a; --badge-indexing-border: #574427; --badge-indexing-bg: #2e2618;
    --badge-empty-fg: #9fb2cc; --badge-empty-border: #33415a; --badge-empty-bg: #1d2531;

    --danger-bg: #3a2020; --danger-border: #5a2f2c; --danger-fg: #f3c3bf;
    --warn-bg: #2e2618; --warn-border: #574427; --warn-fg: #f0c37a;

    --sidebar-w: 208px;
    --sidebar-rail: 52px;
  }

  :root[data-theme="light"] {
    --bg: #f2f3f6;
    --bg-pane: #ffffff;
    --bg-sunken: #e9ebef;
    --bg-hover: #e4e7ec;
    --line: #d7dbe2;
    --line-sunken: #e6e9ee;
    --line-table: #e8ebef;
    --fg: #1b1f27;
    --fg-dim: #545c69;
    --fg-mute: #6a7280;
    --accent: #2c66c9;
    --ok: #2f9257;
    --busy: #9d6c0c;
    --idle: #7b8494;
    --err: #c4423a;

    --btn-bg: #f4f5f8;
    --btn-bg-hover: #e9ecf1;
    --btn-border-hover: #c5cbd5;

    --sel-bg: #e2ebfb;
    --sel-fg: #17417e;
    --seg-active-bg: #e2e5eb;

    --badge-git-fg: #3d6b2c; --badge-git-border: #c3dcb6; --badge-git-bg: #eef7ea;
    --badge-off-fg: #8f3a35; --badge-off-border: #e2bcb9; --badge-off-bg: #fbeeed;
    --badge-frozen-fg: #1d6b8a; --badge-frozen-border: #b6d7e4; --badge-frozen-bg: #eaf5fa;
    --badge-ready-fg: #22703f; --badge-ready-border: #b9debe; --badge-ready-bg: #ecf8ef;
    --badge-indexing-fg: #8a6209; --badge-indexing-border: #e5d3a4; --badge-indexing-bg: #fdf6e5;
    --badge-empty-fg: #3d5580; --badge-empty-border: #c3cfe4; --badge-empty-bg: #eef2f9;

    --danger-bg: #fbeceb; --danger-border: #e6bfbc; --danger-fg: #97302a;
    --warn-bg: #fdf4e3; --warn-border: #e6d3a8; --warn-fg: #8a6209;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 var(--sans);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  [hidden] { display: none !important; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border: 3px solid transparent; background-clip: content-box; border-radius: 8px; }

  /* ═══════════ shell: sidebar + one full page ═══════════ */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    height: 100%;
    transition: grid-template-columns 140ms ease;
  }
  .app.is-collapsed { grid-template-columns: var(--sidebar-rail) minmax(0, 1fr); }

  .sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg-sunken);
    border-right: 1px solid var(--line);
    overflow: hidden;
  }

  .sb-top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 10px;
    border-bottom: 1px solid var(--line);
  }
  .sb-brand { flex: 1; min-width: 0; font-size: 14px; font-weight: 650; letter-spacing: .01em; }
  .is-collapsed .sb-brand { display: none; }
  .sb-toggle {
    flex: none;
    display: inline-flex;
    padding: 4px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--fg-mute);
  }
  .sb-toggle:hover { background: var(--bg-hover); color: var(--fg); }
  .is-collapsed .sb-toggle { margin: 0 auto; }
  .is-collapsed .sb-toggle svg { transform: scaleX(-1); }

  .sb-nav { flex: 1; min-height: 0; overflow: auto; padding: 8px 6px; }
  .sb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 32px;
    padding: 0 8px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--fg-dim);
    text-align: left;
    white-space: nowrap;
  }
  .sb-item + .sb-item { margin-top: 2px; }
  .sb-item:hover { background: var(--bg-hover); color: var(--fg); }
  .sb-item.is-active { background: var(--sel-bg); color: var(--sel-fg); font-weight: 500; }
  .sb-item svg { flex: none; }
  .sb-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sb-item .cnt { flex: none; color: var(--fg-mute); font: 11px/1 var(--mono); }
  .sb-item.is-active .cnt { color: var(--sel-fg); }
  .is-collapsed .sb-item { justify-content: center; padding: 0; }
  .is-collapsed .sb-item .lbl, .is-collapsed .sb-item .cnt { display: none; }

  /* The machine's three facts sit at the bottom of the sidebar, where an app
     usually puts the account chip. They belong to the machine, not to a page,
     so they must not ride in the header — that space is for a page's actions. */
  .sb-foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    padding: 8px 10px;
    border-top: 1px solid var(--line);
    color: var(--fg-mute);
    font: 10.5px/1.4 var(--mono);
    white-space: nowrap;
    overflow: hidden;
  }
  .sb-foot .sep { color: var(--line); }
  .sb-foot .ver { margin-left: auto; }
  .is-collapsed .sb-foot { justify-content: center; padding: 8px 4px; }
  .is-collapsed .sb-foot .txt, .is-collapsed .sb-foot .sep, .is-collapsed .sb-foot .ver { display: none; }

  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .dot.busy { background: var(--busy); }
  .dot.err { background: var(--err); }
  .dot.idle { background: var(--idle); }

  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pages { position: relative; flex: 1; min-width: 0; min-height: 0; }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Persistent header. The left half swaps with the tab; the right half never
     does — it is the machine, and the machine does not depend on the page. */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 7px 12px;
    background: var(--bg-pane);
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }
  .top-left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }

  /* ═══════════ shared bits ═══════════ */
  .page-title { font-size: 13.5px; font-weight: 650; white-space: nowrap; }
  .page-sub { color: var(--fg-mute); font-size: 11.5px; white-space: nowrap; }
  .grow { flex: 1; min-width: 4px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 27px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--btn-bg);
    color: var(--fg);
    font-size: 12px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--btn-bg-hover); border-color: var(--btn-border-hover); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--fg-dim); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--fg); }
  .btn-icon { min-width: 27px; padding: 4px; }
  .btn-sm { min-height: 23px; padding: 2px 7px; font-size: 11.5px; }
  .btn svg { width: 14px; height: 14px; }

  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg { border: 0; padding: 4px 9px; background: transparent; color: var(--fg-dim); font-size: 11.5px; }
  .seg + .seg { border-left: 1px solid var(--line); }
  .seg:hover { color: var(--fg); }
  .seg.is-active { background: var(--seg-active-bg); color: var(--fg); }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border: 1px solid transparent;
    border-radius: 4px;
    font: 10.5px/1.5 var(--mono);
    white-space: nowrap;
  }
  .badge-ready { color: var(--badge-ready-fg); border-color: var(--badge-ready-border); background: var(--badge-ready-bg); }
  .badge-indexing { color: var(--badge-indexing-fg); border-color: var(--badge-indexing-border); background: var(--badge-indexing-bg); }
  .badge-empty { color: var(--badge-empty-fg); border-color: var(--badge-empty-border); background: var(--badge-empty-bg); }
  .badge-git { color: var(--badge-git-fg); border-color: var(--badge-git-border); background: var(--badge-git-bg); }
  .badge-nogit { color: var(--fg-mute); border-color: var(--line); background: var(--bg-sunken); }
  .badge-frozen { color: var(--badge-frozen-fg); border-color: var(--badge-frozen-border); background: var(--badge-frozen-bg); }
  .badge-off { color: var(--badge-off-fg); border-color: var(--badge-off-border); background: var(--badge-off-bg); }

  .banner {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--warn-border);
    background: var(--warn-bg);
    color: var(--warn-fg);
    font-size: 12px;
  }
  .banner strong { color: var(--fg); }
  .banner .btn { margin-left: auto; }
  .empty-hint { margin: 0; padding: 18px 14px; color: var(--fg-mute); font-size: 12px; }

  /* ═══════════ page: Памʼять (three panes, as today) ═══════════ */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 300px minmax(0, 1fr); }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg-pane); border-right: 1px solid var(--line); }
  .pane:last-child { border-right: 0; }
  .pane-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 6px 11px;
    background: var(--bg-sunken);
    border-bottom: 1px solid var(--line);
  }
  .pane-head h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-dim); }
  .pane-head h2.file-title { letter-spacing: 0; text-transform: none; font: 500 12px/1.4 var(--mono); color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-sub { color: var(--fg-mute); font: 10.5px/1 var(--mono); }
  .pane-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .pane-body { min-height: 0; overflow: auto; }
  .toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-dim); font-size: 11px; white-space: nowrap; }

  .bank { position: relative; padding: 10px 11px; border-bottom: 1px solid var(--line-sunken); cursor: pointer; }
  .bank:hover { background: var(--bg-hover); }
  .bank.is-selected { background: var(--sel-bg); box-shadow: inset 2px 0 var(--accent); }
  .bank.is-disabled { opacity: .62; }
  .bank-row { display: flex; align-items: flex-start; gap: 6px; }
  .bank-head { flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .bank-name { font-size: 12.5px; font-weight: 650; }
  .btn-menu { flex: none; border: 0; border-radius: 4px; padding: 0 4px; background: transparent; color: var(--fg-mute); font: 600 15px/1.2 var(--mono); }
  .btn-menu:hover { background: var(--bg-hover); color: var(--fg); }
  .bank-root { display: block; margin-top: 6px; color: var(--fg-mute); font: 10.5px/1.5 var(--mono); overflow-wrap: anywhere; }
  .bank-stats { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--fg-dim); font: 10.5px/1.5 var(--mono); }
  .bank-stats .muted { color: var(--fg-mute); }

  .menu {
    position: fixed;
    z-index: 50;
    min-width: 214px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-pane);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .38);
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 9px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--fg);
    text-align: left;
    font-size: 12.5px;
  }
  .menu-item:hover { background: var(--bg-hover); }
  .menu-item.is-danger { color: var(--err); }
  .menu-item .mark { flex: none; width: 12px; color: var(--accent); }
  .menu-sep { height: 1px; margin: 4px 2px; background: var(--line); }
  .menu-label { padding: 5px 9px 2px; color: var(--fg-mute); font-size: 10.5px; }

  .tree { padding: 5px 0 20px; font-family: var(--mono); font-size: 11.5px; }
  .tree-row { display: flex; align-items: center; gap: 6px; min-height: 25px; padding: 3px 11px; color: var(--fg-dim); cursor: pointer; }
  .tree-row:hover { background: var(--bg-hover); color: var(--fg); }
  .tree-row.is-selected { background: var(--sel-bg); color: var(--sel-fg); }
  .tree-row.indent { padding-left: 26px; }
  .tree-row .caret { width: 9px; font-size: 9px; color: var(--fg-mute); }
  .tree-row .ic { flex: none; width: 14px; display: inline-flex; color: var(--fg-mute); }
  .tree-row .ic svg { width: 13px; height: 13px; }
  .tree-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-row .n { flex: none; color: var(--fg-mute); font-size: 10px; }

  .file-meta { flex: none; display: flex; flex-wrap: wrap; gap: 3px 16px; padding: 7px 14px; border-bottom: 1px solid var(--line-sunken); color: var(--fg-mute); font: 10.5px/1.5 var(--mono); }
  .doc { max-width: 76ch; padding: 18px 16px 80px; font-family: var(--mono); font-size: 12px; line-height: 1.7; transition: background 480ms ease; }
  .doc h1 { margin: 0 0 12px; font: 650 14px/1.45 var(--mono); }
  .doc h2 { margin: 18px 0 10px; font: 650 13px/1.45 var(--mono); }
  .doc p { margin: 0 0 12px; color: var(--fg-dim); }
  .doc ul { margin: 0 0 13px; padding-left: 19px; color: var(--fg-dim); }
  .doc li { margin: 4px 0; }
  .doc strong { color: var(--fg); }
  .chunk-divider { position: relative; height: 22px; margin: 14px 0 6px; border-top: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .chunk-divider span { position: absolute; top: -7px; left: 0; padding-right: 8px; background: var(--bg-pane); color: var(--accent); font: 10px/1 var(--mono); }
  .doc.no-viz .chunk-divider { display: none; }
  .mob-panes { display: none; }

  /* ═══════════ page: Журнал ═══════════ */
  .filters {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--bg-pane);
    border-bottom: 1px solid var(--line);
  }
  .control {
    min-height: 27px;
    padding: 4px 24px 4px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-sunken);
    color: var(--fg-dim);
    font-size: 12px;
  }
  .search { position: relative; display: inline-flex; }
  .search svg { position: absolute; left: 8px; top: 7px; width: 13px; height: 13px; color: var(--fg-mute); pointer-events: none; }
  .search input {
    width: min(240px, 26vw);
    min-height: 27px;
    padding: 4px 8px 4px 26px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-sunken);
    color: var(--fg);
    font-size: 12px;
  }

  .jl { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px minmax(0, 1fr); }
  .events { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg-pane); border-right: 1px solid var(--line); }
  .events-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 30px;
    padding: 5px 11px;
    background: var(--bg-sunken);
    border-bottom: 1px solid var(--line);
    color: var(--fg-mute);
    font: 10.5px/1 var(--mono);
  }
  .events-body { min-height: 0; overflow: auto; padding: 7px; }

  /* «прямокутнички» — кожен виклик окремою карткою */
  .ev {
    display: block;
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-sunken);
    color: var(--fg);
    text-align: left;

       </div>
       ${e.error ? `<div class="note is-err"><strong>Помилка</strong><br>${esc(e.error)}</div>` : ''}
       ${e.path ? `<div class="d-sec">Файл</div><article class="hit"><div class="hit-top"><span class="hit-r">·</span><div class="hit-l"><div class="hit-p">${esc(e.path)}</div><div class="hit-h">поточний файл банку ${e.bank}</div></div></div><div class="hit-foot"><span>перехід до поточного вмісту</span><button class="btn btn-ghost btn-sm go" data-p="${esc(e.path)}" data-b="${e.bank}">${OPEN}Відкрити в Памʼяті</button></div></article>` : ''}`;
    bindGo();
  }

  function bindGo() {
    document.querySelectorAll('.go').forEach(b => b.addEventListener('click', () => {
      selectBank(b.dataset.b);
      setPage('memory');
      renderBanks();
      openFile(b.dataset.p, true);
    }));
  }

  function renderJournal() {
    renderList();
    if (kind === 'query') renderQ(QUERIES.find(e => e.id === selQ) || QUERIES[0]);
    else renderI(INDEXES.find(e => e.id === selI) || INDEXES[0]);
  }

  /* ---------- Налаштування ---------- */
  function renderSettings(sec) {
    document.getElementById('set-body').innerHTML = SETTINGS[sec];
    document.querySelectorAll('[data-sec]').forEach(b => b.classList.toggle('is-active', b.dataset.sec === sec));
    // submit: null → кнопки немає (не «сіра»)
    document.getElementById('set-foot').hidden = sec === 'maint';
    document.querySelectorAll('.set-form .segmented:not(#theme)').forEach(group =>
      group.querySelectorAll('.seg').forEach(s => s.addEventListener('click', () =>
        group.querySelectorAll('.seg').forEach(x => x.classList.toggle('is-active', x === s)))));
    // Theme is the one control here that applies on click: it is a browser
    // preference, not a machine value, so «Зберегти» has nothing to send for it.
    const themeBox = document.getElementById('theme');
    if (themeBox) {
      const now = document.documentElement.dataset.theme;
      themeBox.querySelectorAll('.seg').forEach(b => {
        b.classList.toggle('is-active', b.dataset.theme === now);
        b.addEventListener('click', () => setTheme(b.dataset.theme));
      });
    }
  }

  /* ---------- wiring ---------- */
  document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => setPage(b.dataset.page)));
  document.querySelectorAll('[data-sec]').forEach(b => b.addEventListener('click', () => renderSettings(b.dataset.sec)));
  document.querySelectorAll('[data-mob]').forEach(b => b.addEventListener('click', () => showPane(b.dataset.mob)));

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme .seg').forEach(b => b.classList.toggle('is-active', b.dataset.theme === t));
  }

  setTheme('dark');
  renderBanks();
  renderTree();
  selectBank(bankId);
  openFile('logs/2026-08-17-cabinet-navigation.md');
  renderHead();
  renderJournal();
  renderSettings('embed');
</script>

</body>
</html>
